# Configuration markers:
# - [MUST CHANGE] Must be replaced before first startup, otherwise the service refuses to start or poses a security risk.
# - [CHANGE AS NEEDED] Adjust only when the deployment topology changes.
# - [USUALLY DO NOT CHANGE] Recommended defaults are already applied.

server:
  # [USUALLY DO NOT CHANGE] The Docker image overrides this to 0.0.0.0:8000 via startup flags.
  listen: "127.0.0.1:8000"
  # [USUALLY DO NOT CHANGE] Per-request body limit is 32 MiB.
  maxBodyBytes: 33554432
  # [CHANGE AS NEEDED] List only trusted reverse proxies allowed to override X-Forwarded-For / X-Real-IP.
  # When empty, all forwarded headers are ignored and the direct peer IP is recorded; never use 0.0.0.0/0 or ::/0.
  # Docker/Nginx example:["127.0.0.1", "172.16.0.0/12"]
  trustedProxies: []
  # [USUALLY DO NOT CHANGE] Limits only the time for the client to upload the full request body; does not limit inference or streaming responses.
  readTimeout: 15m
  # [USUALLY DO NOT CHANGE] Maximum lifetime of admin API and non-streaming requests.
  requestTimeout: 2h
  # [CHANGE AS NEEDED] Enable only locally or in trusted environments; keep false in production.
  swaggerEnabled: false

auth:
  # [USUALLY DO NOT CHANGE] Admin access and refresh token lifetimes.
  accessTokenTTL: 15m
  refreshTokenTTL: 720h
  # [CHANGE AS NEEDED] Must be true when the external address uses HTTPS.
  secureCookies: false

secrets:
  # [MUST CHANGE] At least 32 characters. Quick generate: openssl rand -hex 32
  jwtSecret: "replace-with-at-least-32-characters"
  # [MUST CHANGE] Base64-encoded 32-byte key. Quick generate: openssl rand -base64 32
  # Must be retained long-term after the first account is written; changing it later makes existing credentials undecryptable.
  credentialEncryptionKey: "replace-with-base64-key"

bootstrapAdmin:
  # [CHANGE AS NEEDED] Used only when no admin exists in the database.
  username: "admin"
  # [MUST CHANGE] Replace with a strong password before first startup; remove this section after the admin is created.
  password: "replace-with-a-strong-password"

frontend:
  # [USUALLY DO NOT CHANGE] Frontend build directory served same-origin by the Go service.
  staticPath: "./frontend/dist"

database:
  # [CHANGE AS NEEDED] Use sqlite for a single instance; switch to postgres for multiple instances.
  driver: sqlite # sqlite | postgres
  sqlite:
    # [USUALLY DO NOT CHANGE] Relative paths resolve against this config file directory.
    path: "./data/backend.db"
  postgres:
    # [MUST CHANGE: only driver=postgres] Provide the real DSN, and enable sslmode as needed.
    # Can also be injected via GROK2API_DATABASE_URL; a non-empty env var overrides this field and enables postgres automatically.
    dsn: "postgres://user:password@127.0.0.1:5432/grok2api?sslmode=disable"
    # [CHANGE AS NEEDED] Adjust based on database connection capacity.
    maxOpenConns: 50
    maxIdleConns: 10

runtimeStore:
  # [CHANGE AS NEEDED] Use memory for a single instance; switch to redis for multiple instances.
  driver: memory # memory | redis
  redis:
    # [MUST CHANGE: only driver=redis] Provide the Redis connection details.
    address: "127.0.0.1:6379"
    username: ""
    password: ""
    database: 0
    # [USUALLY DO NOT CHANGE] Only change when multiple instance groups share one Redis.
    keyPrefix: "grok2api:"
    # [CHANGE AS NEEDED] Set true when Redis uses TLS.
    tls: false

deployment:
  # [USUALLY DO NOT CHANGE] Keep 1 for a single instance; multiple instances must use PostgreSQL, Redis, and a shared media directory together.
  replicas: 1
  # [MUST CHANGE: only replicas>1] Each instance uses a distinct stable identifier.
  instanceID: ""
  # [MUST CHANGE: only replicas>1] Instances in the same group sharing a media directory must use the same identifier.
  clusterID: "grok2api"
  # [MUST CHANGE: only replicas>1] Confirm media.local.path is mounted as shared read-write storage for all instances.
  sharedMedia: false

media:
  # [USUALLY DO NOT CHANGE] Only local is supported; capacity and cleanup policies are set in the admin UI.
  driver: local
  local:
    # [CHANGE AS NEEDED] Image binary directory; the database stores only asset metadata.
    path: "./data/media"

routing:
  # [CHANGE AS NEEDED] Server-side reasoning replay cache: automatically re-attaches encrypted_content the client did not send on later turns.
  reasoningReplayEnabled: true
  reasoningReplayTTL: 1h
  reasoningReplayMaxEntries: 10240
  # [CHANGE AS NEEDED] Isolate upstream connection pools per account, suited for external L4/connection-hash load balancing; increases connections, TLS handshakes, and file descriptor usage.
  accountIsolatedConnections: false
  # [USUALLY DO NOT CHANGE] Large account pools use bounded segmented selection by default; keeps full-pool fallback, quota priority, and atomic concurrency gating.
  segmentedSelectorEnabled: true
  segmentedSelectorMinCandidates: 3000
  segmentedSelectorWindowSize: 64
  # [CHANGE AS NEEDED] Only needed for large account pools. 0 keeps historical behavior: auto accounts on unhealthy nodes migrate all at once.
  # 0.05–1 means each healthy node absorbs at most that fraction of active accounts. Env var
  # GROK2API_AUTO_ASSIGN_MAX_NODE_SHARE overrides this.
  autoAssignMaxNodeShare: 0
  # [CHANGE AS NEEDED] Only needed for large account pools. 0 keeps historical behavior: first-round evacuation is uncapped, capacity/rebalance still capped at 200.
  # 0.05–1 limits the fraction of bound accounts migrated per round. Env var
  # GROK2API_AUTO_ASSIGN_MAX_MIGRATION_SHARE overrides this.
  autoAssignMaxMigrationShare: 0

audit:
  # [USUALLY DO NOT CHANGE] Audit batch-write parameters; bufferSize changes require a restart.
  bufferSize: 16384
  batchSize: 256
  flushInterval: 250ms
  # [USUALLY DO NOT CHANGE] Audits needing caller-committed confirmation wait at most this long to aggregate; keep 1ms-50ms.
  commitDelay: 5ms
  # [USUALLY DO NOT CHANGE] enforce pauses new inference requests after anomalies persist past the grace period; pauses immediately when data loss is confirmed.
  ledgerMode: enforce # observe | enforce
  ledgerFailureThreshold: 1
  ledgerUnhealthyGrace: 10s
  ledgerQueueHighWatermarkPercent: 90

# [ENABLE AS NEEDED] Grok Build egress quality guard. Configuration alone does not start the sidecar;
# start it with docker compose --profile quality-guard up -d --build.
qualityGuard:
  enabled: false
  # The main program automatically creates and reuses a non-exportable internal probe identity; no Client Key needed.
  # With a Build model verified to emit reasoning tokens, the built-in recovery probe also validates reasoning tokens.
  model: "grok-4.5"
  mode: hybrid # passive | active | hybrid
  activeInterval: 30m
  passivePollInterval: 5s
  softTPS: 500
  hardTPS: 1000
  consecutiveSoft: 2
  consecutiveErrors: 2
  quarantineDuration: 5m
  noAccountBackoff: 5m
  minimumHealthyNodes: 3
  maxOutputTokens: 384
  failClosed: false
  minimumGenerationWindow: 1s
  # Optional trusted IP-rotation webhook; when enabled also fill in rotatableNodeIDs.
  rotationURL: ""
  rotationToken: ""
  rotationTimeout: 45s
  nodeIDs: []
  rotatableNodeIDs: []
  # Optional request-path withhold/retry for thinking models. Disabled by default.
  # Missing thinking with enough visible output is not delivered; another account
  # is tried (up to maxAttempts). fail_closed returns 503 instead of the last body.
  requestRetry:
    enabled: false
    maxAttempts: 6
    holdTimeout: 3s
    minOutputTokens: 32
    onExhausted: fail_closed # fail_open | fail_closed
    # First missing-thinking hit cools the account; a later hit after the
    # cooldown expires disables it.
    accountCooldown: 24h
